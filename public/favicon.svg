  <circle cx="68" cy="30" r="5" fill="url(#goldGrad)" />
  <circle cx="68" cy="70" r="5" fill="url(#goldGrad)" />
  
  <!-- Mini Infinity / Sparkle in Top Right -->
  <path d="M 75 18 Q 78 14 81 18 Q 84 22 81 26 Q 78 22 75 18 Z" fill="#6ffbbe" opacity="0.9" />
